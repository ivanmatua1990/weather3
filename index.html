<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Weather Dual LED</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 880px;
    height: 440px;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
    color: white;
}

#background {
    position: absolute;
    top: 0;
    left: 0;
    width: 880px;
    height: 440px;
    background: linear-gradient(180deg, #101010, #000000);
}

.weather-bar {
    position: absolute;
    top: 0;
    width: 440px;
    height: 80px;

    display: flex;
    align-items: center;

    box-sizing: border-box;

    padding-left: 18px;
    padding-right: 12px;

    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

#left {
    left: 0;
}

#right {
    left: 440px;
}

.icon {
    font-size: 38px;
    width: 42px;
    text-align: center;
    flex-shrink: 0;
}

.temp {
    font-size: 38px;
    font-weight: bold;
    margin-left: 8px;
    flex-shrink: 0;
}

.info {
    display: flex;
    flex-direction: column;
    justify-content: center;

    margin-left: 18px;

    width: 120px;

    overflow: hidden;
}

.city {
    font-size: 16px;
    font-weight: bold;
    white-space: nowrap;
}

.wind {
    font-size: 13px;
    white-space: nowrap;
}

.time {
    margin-left: auto;
    font-size: 30px;
    font-weight: bold;
    white-space: nowrap;
    flex-shrink: 0;
}
</style>
</head>

<body>

<div id="background"></div>

<div class="weather-bar" id="left">

    <div class="icon" id="icon1">⛅</div>

    <div class="temp" id="temp1">--°</div>

    <div class="info">
        <div class="city">Караганда</div>
        <div class="wind" id="wind1">Ветер: --</div>
    </div>

    <div class="time" id="time1">--:--</div>

</div>

<div class="weather-bar" id="right">

    <div class="icon" id="icon2">⛅</div>

    <div class="temp" id="temp2">--°</div>

    <div class="info">
        <div class="city">Караганда</div>
        <div class="wind" id="wind2">Ветер: --</div>
    </div>

    <div class="time" id="time2">--:--</div>

</div>

<script>

const weatherMap = {

    0: "☀️",
    1: "🌤️",
    2: "⛅",
    3: "☁️",

    45: "🌫️",
    48: "🌫️",

    51: "🌤️",
    53: "🌤️",
    55: "🌧️",

    61: "🌧️",
    63: "🌧️",
    65: "🌧️",

    71: "🌨️",
    73: "🌨️",
    75: "❄️",

    80: "🌦️",
    81: "🌦️",

    82: "⛈️",

    95: "⛈️",
    96: "⛈️",
    99: "⛈️"

};

function windDirection(deg) {

    const dirs = ["С","СВ","В","ЮВ","Ю","ЮЗ","З","СЗ"];

    return dirs[Math.round(deg / 45) % 8];
}

function updateTime() {

    const time = new Date().toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
    });

    document.getElementById("time1").innerHTML = time;
    document.getElementById("time2").innerHTML = time;
}

function setBoth(icon, temp, windText) {

    for (let id = 1; id <= 2; id++) {

        document.getElementById("icon" + id).innerHTML =
            icon;

        document.getElementById("temp" + id).innerHTML =
            temp + "°";

        document.getElementById("wind" + id).innerHTML =
            windText;
    }
}

function loadOpenMeteo() {

    const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=49.8047" +
        "&longitude=73.1094" +
        "&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m" +
        "&wind_speed_unit=ms" +
        "&timezone=auto";

    fetch(url, { cache: "no-store" })

        .then(function(response) {

            if (!response.ok)
                throw new Error("Open-Meteo error");

            return response.json();
        })

        .then(function(data) {

            const current = data.current;

            const temp =
                Math.round(current.temperature_2m);

            const code =
                current.weather_code;

            const wind =
                Math.round(current.wind_speed_10m);

            const windDeg =
                current.wind_direction_10m;

            const icon =
                weatherMap[code] || "⛅";

            setBoth(
                icon,
                temp,
                "Ветер: " + wind +
                " м/с " +
                windDirection(windDeg)
            );
        })

        .catch(function() {

            loadWttr();
        });
}

function loadWttr() {

    const url =
        "https://wttr.in/Karaganda?format=j1";

    fetch(url, { cache: "no-store" })

        .then(function(response) {

            if (!response.ok)
                throw new Error("wttr error");

            return response.json();
        })

        .then(function(data) {

            const current =
                data.current_condition[0];

            const temp =
                Math.round(
                    Number(current.temp_C)
                );

            const wind =
                Math.round(
                    Number(current.windspeedKmph) / 3.6
                );

            const desc =
                current.weatherDesc[0]
                .value
                .toLowerCase();

            let icon = "⛅";

            if (
                desc.includes("rain") ||
                desc.includes("drizzle")
            ) {

                icon = "🌧️";
            }

            if (
                desc.includes("snow")
            ) {

                icon = "🌨️";
            }

            if (
                desc.includes("thunder")
            ) {

                icon = "⛈️";
            }

            if (
                desc.includes("fog") ||
                desc.includes("mist")
            ) {

                icon = "🌫️";
            }

            setBoth(
                icon,
                temp,
                "Ветер: " + wind + " м/с"
            );
        })

        .catch(function() {

            setBoth(
                "⚠️",
                "--",
                "Нет данных"
            );
        });
}

updateTime();

setInterval(updateTime, 1000);

loadOpenMeteo();

setInterval(function() {

    loadOpenMeteo();

}, 600000);

</script>

</body>
</html>
