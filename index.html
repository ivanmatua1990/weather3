<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Weather Dual LED</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 880px;
    height: 440px;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
    color: white;
}

#background {
    position: absolute;
    top: 0;
    left: 0;
    width: 880px;
    height: 440px;
    background: linear-gradient(180deg, #101010, #000000);
}

.weather-bar {
    position: absolute;
    top: 0;
    width: 440px;
    height: 80px;

    display: flex;
    align-items: center;

    box-sizing: border-box;

    padding-left: 60px;
    padding-right: 35px;

    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

#left {
    left: 0;
}

#right {
    left: 440px;
}

.icon {
    font-size: 42px;
    width: 50px;
    text-align: center;
}

.temp {
    font-size: 36px;
    font-weight: bold;
    margin-left: 18px;
}

.info {
    display: flex;
    flex-direction: column;
    margin-left: 18px;
}

.city {
    font-size: 18px;
    font-weight: bold;
}

.desc {
    font-size: 14px;
}

.wind {
    font-size: 14px;
}

.time {
    margin-left: auto;
    font-size: 26px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="background"></div>

<div class="weather-bar" id="left">

    <div class="icon" id="icon1">⛅</div>

    <div class="temp" id="temp1">--°</div>

    <div class="info">
        <div class="city">Караганда</div>
        <div class="desc" id="desc1">Загрузка...</div>
        <div class="wind" id="wind1">Ветер: --</div>
    </div>

    <div class="time" id="time1">--:--</div>

</div>

<div class="weather-bar" id="right">

    <div class="icon" id="icon2">⛅</div>

    <div class="temp" id="temp2">--°</div>

    <div class="info">
        <div class="city">Караганда</div>
        <div class="desc" id="desc2">Загрузка...</div>
        <div class="wind" id="wind2">Ветер: --</div>
    </div>

    <div class="time" id="time2">--:--</div>

</div>

<script>

function updateTime() {

    const time = new Date().toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
    });

    document.getElementById("time1").innerHTML = time;
    document.getElementById("time2").innerHTML = time;
}

function loadWeather(id) {

    fetch("https://wttr.in/Karaganda?format=j1")
    .then(response => response.json())
    .then(data => {

        const current = data.current_condition[0];

        const temp = current.temp_C;

        const wind = Math.round(current.windspeedKmph / 3.6);

        const desc = current.weatherDesc[0].value;

        document.getElementById("temp" + id).innerHTML =
            temp + "°";

        document.getElementById("desc" + id).innerHTML =
            desc;

        document.getElementById("wind" + id).innerHTML =
            "Ветер: " + wind + " м/с";

    })
    .catch(error => {

        console.log(error);

        document.getElementById("desc" + id).innerHTML =
            "Ошибка";

        document.getElementById("wind" + id).innerHTML =
            "Нет данных";
    });
}

updateTime();

setInterval(updateTime, 1000);

loadWeather(1);
loadWeather(2);

setInterval(function() {

    loadWeather(1);
    loadWeather(2);

}, 600000);

</script>

</body>
</html>
